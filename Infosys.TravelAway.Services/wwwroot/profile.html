<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelAway - Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
    <div class="nav-container">
        <a class="logo" href="index.html"><span>✈</span> TravelAway</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="my-bookings.html">My Bookings</a>
            <a class="active" href="profile.html">Profile</a>
        </nav>
    </div>
</header>

<main class="auth-page">
    <div class="form-card wide-card">
        <p class="eyebrow">ACCOUNT</p>
        <h1>My Profile</h1>

        <form id="profileLookup" class="inline-form">
            <input id="lookupEmail" type="email" placeholder="Customer email" required>
            <button class="btn btn-outline" type="submit">Load Profile</button>
        </form>

        <hr>

        <form id="profileForm" class="form-grid">
            <label>Email ID
                <input id="emailId" type="email" readonly required>
            </label>
            <label>First Name
                <input id="firstName" required>
            </label>
            <label>Last Name
                <input id="lastName" required>
            </label>
            <label>Gender
                <select id="gender" required>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </label>
            <label>Contact Number
                <input id="contactNumber" type="tel" maxlength="10" required>
            </label>
            <label>Date of Birth
                <input id="dateOfBirth" type="date" required>
            </label>
            <label class="span-2">Address
                <textarea id="address" required></textarea>
            </label>
            <div class="span-2">
                <button class="btn btn-primary" type="submit">Update Profile</button>
            </div>
        </form>
        <div id="profileMessage" class="message"></div>
    </div>
</main>

<script src="js/profile.js"></script>
</body>
</html>
